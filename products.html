<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Favour Hairs</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Poppins,sans-serif;
            background:linear-gradient(to right,#F8F1F4,#EDE1E7);
            color:#333;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar_products{
            display:flex;
            align-items:center;
            padding:20px 40px;
            background:#5C2748;
        }

        .logo{
            flex:1;
        }

        .logo h2{
            color:white;
            font-family:Georgia,serif;
            font-size:28px;
        }

        .navbar_products nav{
            flex:1;
            text-align:right;
        }

        .navbar_products ul{
            list-style:none;
        }

        .navbar_products ul li{
            display:inline-block;
            margin-right:22px;
        }

        .navbar_products ul li a{
            color:white;
            text-decoration:none;
            display:flex;
            align-items:center;
            gap:5px;
            font-family:Georgia,serif;
        }

        .navbar_products ul li a:hover{
            color:#E8D2DD;
        }

        .cart-count{
            background:#E8D2DD;
            color:#5C2748;
            font-size:12px;
            font-weight:bold;
            width:20px;
            height:20px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header{
            text-align:center;
            padding:60px 20px 35px;
        }

        .page-header h1{
            font-family:Georgia,serif;
            color:#5C2748;
            font-size:42px;
            margin-bottom:10px;
        }

        .page-header p{
            color:#666;
        }


        /* =========================
           CATEGORY BUTTONS
        ========================= */

        .category-buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            margin-bottom:45px;
            flex-wrap:wrap;
        }

        .category-buttons button{
            border:2px solid #5C2748;
            background:transparent;
            color:#5C2748;
            padding:12px 25px;
            border-radius:25px;
            cursor:pointer;
            font-size:15px;
            transition:0.3s;
        }

        .category-buttons button:hover,
        .category-buttons button.active{
            background:#5C2748;
            color:white;
        }


        /* =========================
           PRODUCT AREA
        ========================= */

        .product-area{
            max-width:1200px;
            margin:auto;
            padding:0 20px 70px;
        }

        .product-area.has-filters{
            display:grid;
            grid-template-columns:230px 1fr;
            gap:35px;
        }


        /* =========================
           FILTERS
        ========================= */

        .product-filters{
            display:none;
            background:white;
            padding:20px;
            border-radius:15px;
            height:max-content;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .product-filters.show{
            display:block;
        }

        .product-filters h3{
            color:#5C2748;
            margin-bottom:20px;
            font-family:Georgia,serif;
        }

        .filter-section{
            display:none;
            margin-bottom:20px;
        }

        .filter-section.active{
            display:block;
        }

        .filter-section h4{
            color:#5C2748;
            margin-bottom:10px;
        }

        .filter-option{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        .filter-option input{
            margin-right:7px;
        }

        .filter-buttons{
            display:flex;
            gap:8px;
            flex-direction:column;
            margin-top:20px;
        }

        .filter-buttons button{
            padding:10px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .apply-filter{
            background:#5C2748;
            color:white;
        }

        .clear-filter{
            background:#E8D2DD;
            color:#5C2748;
        }


        /* =========================
           PRODUCTS GRID
        ========================= */

        .products-grid{
            display:grid;
            grid-template-columns:repeat(3,minmax(300px,1fr));
            gap:25px;
        }

        .product-card{
            background:white;
            padding:15px;
            border-radius:15px;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .product-card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 25px rgba(0,0,0,0.12);
        }

        .product-card img{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:12px;
            display:block;
        }

        .product-info{
            padding:15px 5px 5px;
        }

        .product-info h3{
            font-family:Georgia,serif;
            color:#5C2748;
            margin-bottom:8px;
        }

        .product-description{
            font-size:14px;
            color:#666;
            margin-bottom:10px;
        }

        .product-price{
            font-weight:bold;
            color:#5C2748;
            font-size:17px;
            margin-bottom:15px;
        }

        .product-buttons{
            display:flex;
            gap:10px;
        }

        .product-buttons a,
        .product-buttons button{
            flex:1;
            padding:11px 8px;
            border-radius:8px;
            font-size:13px;
            cursor:pointer;
            text-align:center;
            text-decoration:none;
        }

        .view-product-btn{
            border:2px solid #5C2748;
            background:white;
            color:#5C2748;
        }

        .shop-product-btn{
            border:2px solid #5C2748;
            background:#5C2748;
            color:white;
        }

        .view-product-btn:hover{
            background:#F8F1F4;
        }

        .shop-product-btn:hover{
            background:#843966;
        }


        /* =========================
           EMPTY / ERROR
        ========================= */

        .empty-products{
            grid-column:1 / -1;
            text-align:center;
            padding:60px 20px;
            background:white;
            border-radius:15px;
        }

        .empty-products h3{
            color:#5C2748;
            font-family:Georgia,serif;
            margin-bottom:8px;
        }

        .empty-products p{
            color:#777;
        }


        /* =========================
           CART MESSAGE
        ========================= */

        .cart-message{
            position:fixed;
            bottom:25px;
            right:25px;
            background:#5C2748;
            color:white;
            padding:15px 22px;
            border-radius:10px;
            opacity:0;
            transform:translateY(20px);
            pointer-events:none;
            transition:0.3s;
            z-index:1000;
        }

        .cart-message.show{
            opacity:1;
            transform:translateY(0);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:1000px){

            .products-grid{
                grid-template-columns:
                    repeat(2,minmax(250px,1fr));
            }

        }


        @media(max-width:750px){

            .navbar_products{
                padding:18px 20px;
            }

            .navbar_products nav{
                display:none;
            }

            .product-area.has-filters{
                display:block;
            }

            .product-filters{
                margin-bottom:30px;
            }

            .products-grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>

    <script>


        /* =========================
           API
        ========================= */

        const API_BASE =
            "http://127.0.0.1:5000/api";

        const API_ORIGIN =
            "http://127.0.0.1:5000";


        const CART_KEY =
            "favourHairsCart";


        let products = [];

        let categories = [];

        let currentCategory = null;



        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHTML(value){

            return String(value ?? "")
                .replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;")
                .replace(/'/g,"&#039;");

        }



        /* =========================
           IMAGE URL
        ========================= */

        function getImageUrl(image){

            if(!image){

                return "images/bob.jpg";

            }


            if(
                image.startsWith("http://") ||
                image.startsWith("https://") ||
                image.startsWith("data:")
            ){

                return image;

            }


            if(image.startsWith("/")){

                return API_ORIGIN + image;

            }


            if(image.startsWith("uploads/")){

                return API_ORIGIN + "/" + image;

            }


            if(image.startsWith("/uploads/")){

                return API_ORIGIN + image;

            }


            return image;

        }



        /* =========================
           NORMALIZE FILTER VALUE
        ========================= */

        function normalizeFilterValue(value){

            const key =
                String(value || "")
                .trim()
                .toLowerCase();


            const valueMap = {

                "human hair":"human",
                "synthetic":"synthetic",
                "blend hair":"blend",

                "full lace":"full-lace",
                "frontal":"frontal",
                "closure":"closure",
                "360 lace":"360-lace",

                "glue-less":"glueless",
                "glueless":"glueless",

                "bone straight":"bone-straight",
                "body wave":"body-wave",
                "curly":"curly",
                "bob":"bob",
                "braided":"braided",
                "pixie cut":"pixie",

                "deep wave":"deep-wave",
                "water wave":"water-wave",
                "kinky":"kinky",

                "hair accessories":"hair-accessories",
                "hair care":"hair-care",
                "styling products":"styling-products",
                "other":"other"

            };


            return valueMap[key]
                ||
                key
                    .replace(/\s+/g,"-")
                    .replace(/[–—]/g,"-")
                    .replace(/[^a-z0-9-]/g,"");

        }



        /* =========================
           NORMALIZE LENGTH
        ========================= */

        function normalizeLength(value){

            const v =
                String(value || "")
                .toLowerCase();


            if(
                v.includes("8") &&
                v.includes("10")
            ){

                return "8-10";

            }


            if(
                v.includes("12") &&
                v.includes("14")
            ){

                return "12-14";

            }


            if(
                v.includes("16") &&
                v.includes("18")
            ){

                return "16-18";

            }


            if(
                v.includes("20") &&
                v.includes("22")
            ){

                return "20-22";

            }


            if(v.includes("24")){

                return "24-plus";

            }


            return normalizeFilterValue(value);

        }



        /* =========================
           FILTER SECTION
        ========================= */

        function getFilterSectionId(categoryName){

            const value =
                String(categoryName || "")
                .toLowerCase();


            if(value.includes("wig")){

                return "wigsFilters";

            }


            if(value.includes("bundle")){

                return "bundlesFilters";

            }


            return "otherFilters";

        }



        /* =========================
           LOAD PRODUCTS FROM API
        ========================= */

        async function loadProducts(){

            const grid =
                document.getElementById(
                    "productsGrid"
                );


            grid.innerHTML = `

                <div class="empty-products">

                    <h3>
                        Loading products...
                    </h3>

                    <p>
                        Please wait.
                    </p>

                </div>

            `;


            try{

                const response =
                    await fetch(
                        `${API_BASE}/products`
                    );


                if(!response.ok){

                    throw new Error(
                        "Could not load products."
                    );

                }


                const data =
                    await response.json();


                /*
                 * Support both:
                 *
                 * [
                 *   {...},
                 *   {...}
                 * ]
                 *
                 * and:
                 *
                 * {
                 *   products:[...]
                 * }
                 */

                if(Array.isArray(data)){

                    products = data;

                } else if(
                    data &&
                    Array.isArray(data.products)
                ){

                    products =
                        data.products;

                } else {

                    products = [];

                }


                renderProducts();

            }catch(error){

                console.error(
                    "PRODUCT LOAD ERROR:",
                    error
                );


                grid.innerHTML = `

                    <div class="empty-products">

                        <h3>
                            Could not load products
                        </h3>

                        <p>
                            Make sure the Flask backend
                            is running on port 5000.
                        </p>

                    </div>

                `;

            }

        }



        /* =========================
           LOAD CATEGORIES FROM API
        ========================= */

        async function loadCategories(){

            const container =
                document.getElementById(
                    "categoryButtons"
                );


            container.innerHTML = "";


            try{

                const response =
                    await fetch(
                        `${API_BASE}/categories`
                    );


                if(!response.ok){

                    throw new Error(
                        "Could not load categories."
                    );

                }


                const data =
                    await response.json();


                if(Array.isArray(data)){

                    categories = data;

                } else if(
                    data &&
                    Array.isArray(data.categories)
                ){

                    categories =
                        data.categories;

                } else {

                    categories = [];

                }


                renderCategories();

            }catch(error){

                console.error(
                    "CATEGORY LOAD ERROR:",
                    error
                );


                /*
                 * Categories are not allowed
                 * to stop products from loading.
                 */

                categories = [];

                renderCategories();

            }

        }



        /* =========================
           RENDER CATEGORIES
        ========================= */

        function renderCategories(){

            const container =
                document.getElementById(
                    "categoryButtons"
                );


            container.innerHTML = "";


            if(categories.length === 0){

                return;

            }


            categories.forEach(category => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.textContent =
                    "Shop " +
                    category.name;


                button.onclick =
                    function(){

                        showCategory(
                            category.name,
                            button
                        );

                    };


                container.appendChild(
                    button
                );

            });

        }



        /* =========================
           RENDER PRODUCTS
        ========================= */

        function renderProducts(){

            const grid =
                document.getElementById(
                    "productsGrid"
                );


            grid.innerHTML = "";


            if(products.length === 0){

                grid.innerHTML = `

                    <div class="empty-products">

                        <h3>
                            No products available
                        </h3>

                        <p>
                            Products added from the
                            admin dashboard will appear here.
                        </p>

                    </div>

                `;

                return;

            }


            products.forEach(product => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                const specifications =
                    product.specifications || {};


                let material = "";

                let construction = "";

                let style = "";

                let texture = "";

                let length = "";

                let type = "";


                Object.keys(
                    specifications
                ).forEach(key => {

                    const lowerKey =
                        key.toLowerCase();


                    const value =
                        specifications[key];


                    if(
                        lowerKey.includes(
                            "material"
                        )
                    ){

                        material =
                            normalizeFilterValue(
                                value
                            );

                    }


                    if(
                        lowerKey.includes(
                            "construction"
                        )
                    ){

                        construction =
                            normalizeFilterValue(
                                value
                            );

                    }


                    if(
                        lowerKey === "style"
                    ){

                        style =
                            normalizeFilterValue(
                                value
                            );

                    }


                    if(
                        lowerKey.includes(
                            "texture"
                        )
                    ){

                        texture =
                            normalizeFilterValue(
                                value
                            );

                    }


                    if(
                        lowerKey.includes(
                            "length"
                        )
                    ){

                        length =
                            normalizeLength(
                                value
                            );

                    }


                    if(
                        lowerKey.includes(
                            "type"
                        )
                    ){

                        type =
                            normalizeFilterValue(
                                value
                            );

                    }

                });


                const image =
                    product.images &&
                    product.images.length
                    ? getImageUrl(
                        product.images[0]
                    )
                    : "images/bob.jpg";


                card.dataset.categoryName =
                    product.category || "";


                card.dataset.material =
                    material;


                card.dataset.construction =
                    construction;


                card.dataset.style =
                    style;


                card.dataset.texture =
                    texture;


                card.dataset.length =
                    length;


                card.dataset.type =
                    type;


                card.innerHTML = `

                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name)}"
                        onerror="this.src='images/bob.jpg'"
                    >


                    <div class="product-info">

                        <h3>
                            ${escapeHTML(
                                product.name
                            )}
                        </h3>


                        <p class="product-description">

                            ${escapeHTML(
                                product.description || ""
                            )}

                        </p>


                        <p class="product-price">

                            ₦${Number(
                                product.price || 0
                            ).toLocaleString()}

                        </p>


                        <div class="product-buttons">

                            <a
                                href="product.html?id=${encodeURIComponent(
                                    product.id
                                )}"
                                class="view-product-btn"
                            >
                                View Product
                            </a>


                            <button
                                class="shop-product-btn"
                                onclick="addToCart(this)"
                                data-id="${escapeHTML(
                                    product.id
                                )}"
                                data-name="${escapeHTML(
                                    product.name
                                )}"
                                data-price="${Number(
                                    product.price || 0
                                )}"
                                data-image="${escapeHTML(
                                    image
                                )}"
                                data-description="${escapeHTML(
                                    product.description || ""
                                )}"
                            >
                                Add to Cart
                            </button>

                        </div>

                    </div>

                `;


                grid.appendChild(
                    card
                );

            });

        }



        /* =========================
           CART
        ========================= */

        const cartCount =
            document.getElementById(
                "cartCount"
            );


        function updateCartCount(){

            const cart =
                JSON.parse(
                    localStorage.getItem(
                        CART_KEY
                    )
                ) || [];


            let totalItems = 0;


            cart.forEach(item => {

                totalItems +=
                    Number(
                        item.quantity
                    ) || 0;

            });


            cartCount.textContent =
                totalItems;

        }



        function addToCart(button){

            const item = {

                id:
                    button.dataset.id,

                name:
                    button.dataset.name,

                price:
                    Number(
                        button.dataset.price
                    ),

                image:
                    button.dataset.image,

                description:
                    button.dataset.description,

                quantity:1

            };


            let cart =
                JSON.parse(
                    localStorage.getItem(
                        CART_KEY
                    )
                ) || [];


            const existingProduct =
                cart.find(
                    cartItem =>
                        cartItem.id ===
                        item.id
                );


            if(existingProduct){

                existingProduct.quantity++;

            }else{

                cart.push(item);

            }


            localStorage.setItem(
                CART_KEY,
                JSON.stringify(cart)
            );


            updateCartCount();


            showCartMessage(
                item.name +
                " added to cart!"
            );

        }



        function showCartMessage(message){

            const cartMessage =
                document.getElementById(
                    "cartMessage"
                );


            cartMessage.textContent =
                message;


            cartMessage.classList.add(
                "show"
            );


            setTimeout(() => {

                cartMessage.classList.remove(
                    "show"
                );

            },2500);

        }



        /* =========================
           CATEGORY SELECTION
        ========================= */

        function showCategory(
            categoryName,
            button
        ){

            currentCategory =
                categoryName;


            document
                .querySelectorAll(
                    ".category-buttons button"
                )
                .forEach(btn => {

                    btn.classList.remove(
                        "active"
                    );

                });


            button.classList.add(
                "active"
            );


            const productArea =
                document.getElementById(
                    "productArea"
                );


            const productFilters =
                document.getElementById(
                    "productFilters"
                );


            document
                .querySelectorAll(
                    ".filter-section"
                )
                .forEach(section => {

                    section.classList.remove(
                        "active"
                    );

                });


            const filterSectionId =
                getFilterSectionId(
                    categoryName
                );


            if(filterSectionId){

                productFilters.classList.add(
                    "show"
                );


                productArea.classList.add(
                    "has-filters"
                );


                const section =
                    document.getElementById(
                        filterSectionId
                    );


                if(section){

                    section.classList.add(
                        "active"
                    );

                }

            }else{

                productFilters.classList.remove(
                    "show"
                );


                productArea.classList.remove(
                    "has-filters"
                );

            }


            document
                .querySelectorAll(
                    ".product-card"
                )
                .forEach(product => {

                    product.style.display =
                        product.dataset.categoryName ===
                        categoryName
                        ? "block"
                        : "none";

                });


            clearFilterCheckboxesOnly();

        }



        /* =========================
           APPLY FILTERS
        ========================= */

        function applyFilters(){

            if(!currentCategory){

                return;

            }


            const activeSection =
                document.querySelector(
                    ".filter-section.active"
                );


            if(!activeSection){

                document
                    .querySelectorAll(
                        ".product-card"
                    )
                    .forEach(product => {

                        product.style.display =
                            product.dataset.categoryName ===
                            currentCategory
                            ? "block"
                            : "none";

                    });

                return;

            }


            const selected = {};


            activeSection
                .querySelectorAll(
                    "input:checked"
                )
                .forEach(input => {

                    const filterType =
                        input.dataset.filter;


                    if(!selected[filterType]){

                        selected[filterType] = [];

                    }


                    selected[filterType].push(
                        input.value
                    );

                });


            document
                .querySelectorAll(
                    ".product-card"
                )
                .forEach(product => {

                    if(
                        product.dataset.categoryName !==
                        currentCategory
                    ){

                        product.style.display =
                            "none";

                        return;

                    }


                    let matches = true;


                    Object.keys(
                        selected
                    ).forEach(filterType => {

                        const productValue =
                            product.dataset[
                                filterType
                            ];


                        if(
                            !selected[
                                filterType
                            ].includes(
                                productValue
                            )
                        ){

                            matches = false;

                        }

                    });


                    product.style.display =
                        matches
                        ? "block"
                        : "none";

                });

        }



        /* =========================
           CLEAR FILTERS
        ========================= */

        function clearFilters(){

            clearFilterCheckboxesOnly();


            if(!currentCategory){

                return;

            }


            document
                .querySelectorAll(
                    ".product-card"
                )
                .forEach(product => {

                    product.style.display =
                        product.dataset.categoryName ===
                        currentCategory
                        ? "block"
                        : "none";

                });

        }



        function clearFilterCheckboxesOnly(){

            document
                .querySelectorAll(
                    ".filter-section input"
                )
                .forEach(input => {

                    input.checked = false;

                });

        }



        /* =========================
           START PAGE
        ========================= */

        async function initializeProductsPage(){

            await Promise.all([

                loadProducts(),

                loadCategories()

            ]);


            updateCartCount();

        }


        initializeProductsPage();


    </script>
